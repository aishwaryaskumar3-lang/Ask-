<!DOCTYPE html>
<html>
<head>
  <title>Messages</title>
  <style>
    body { font-family: Arial; background:#f5f7fb; padding:20px; }
    .msg { background:white; padding:15px; margin-bottom:10px; border-radius:8px; }
  </style>
</head>
<body>

<h2>Received Messages</h2>
<div id="messages"></div>

<script>
async function loadMessages() {
  try {
    const response = await fetch("https://portfolio-backend-q6mj.onrender.com/messages");
    const messages = await response.json();

    const tableBody = document.getElementById("messagesTableBody");
    tableBody.innerHTML = ""; // Clear existing rows

    messages.forEach(msg => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${msg.name}</td>
        <td>${msg.email}</td>
        <td>${msg.message}</td>
        <td>${new Date(msg.date).toLocaleString()}</td>
      `;
      tableBody.appendChild(row);
    });
  } catch (error) {
    console.error("Failed to load messages:", error);
  }
}

// Load messages when page loads
window.addEventListener("DOMContentLoaded", loadMessages);
</script>

</body>
</html>
