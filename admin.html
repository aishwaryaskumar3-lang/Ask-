<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Received Messages</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #4fb7ad;
      margin-bottom: 30px;
    }
    #messages {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 800px;
      margin: auto;
    }
    .msg {
      background: white;
      padding: 15px 20px;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    }
    .msg strong {
      color: #4fb7ad;
    }
    .msg small {
      display: block;
      margin-top: 6px;
      color: #6b7c85;
    }
  </style>
</head>
<body>

<h1>Received Messages</h1>
<div id="messages">Loading messages...</div>

<script>
async function loadMessages() {
  try {
    // Replace URL with your deployed backend if needed
    const response = await fetch("http://localhost:1210/messages");
    const messages = await response.json();

    const container = document.getElementById("messages");
    container.innerHTML = ""; // clear loading text

    if(messages.length === 0){
      container.innerHTML = "<p>No messages received yet.</p>";
      return;
    }

    messages.forEach(msg => {
      const div = document.createElement("div");
      div.className = "msg";
      div.innerHTML = `
        <strong>${msg.name}</strong> (${msg.email})<br>
        ${msg.message}<br>
        <small>${new Date(msg.date).toLocaleString()}</small>
      `;
      container.appendChild(div);
    });

  } catch (error) {
    console.error("Failed to load messages:", error);
    document.getElementById("messages").innerHTML = "<p>Failed to load messages.</p>";
  }
}

// Load messages when page loads
window.addEventListener("DOMContentLoaded", loadMessages);
</script>

</body>
</html>
